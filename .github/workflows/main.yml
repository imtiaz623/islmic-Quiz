name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHEET_API_URL: ${{ vars.SHEET_API_URL }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Files check
        run: |
          ls -la
          for f in package.json capacitor.config.json www/index.html scripts/patch-android.mjs; do
            if [ ! -f "$f" ]; then
              echo "::error::'$f' repo ke root mein nahi mili. Files ko repo ke root mein upload karein (kisi folder ke andar nahi)."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sheet URL lagao (agar variable set hai)
        if: env.SHEET_API_URL != ''
        run: |
          node -e "
          const fs=require('fs');
          let s=fs.readFileSync('www/config.js','utf8');
          s=s.replace(/SHEET_API_URL:\s*\"[^\"]*\"/, 'SHEET_API_URL: ' + JSON.stringify(process.env.SHEET_API_URL));
          fs.writeFileSync('www/config.js', s);
          "

      - name: Android project banao
        run: |
          npx cap add android
          VERSION_CODE=${{ github.run_number }} VERSION_NAME=1.0.${{ github.run_number }} node scripts/patch-android.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (agar keystore secrets hain)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 "$UNSIGNED" app/build/outputs/apk/release/aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/release/IslamicQuiz-release.apk \
            app/build/outputs/apk/release/aligned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamicQuiz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: IslamicQuiz-release-apk
          path: android/app/build/outputs/apk/release/IslamicQuiz-release.apk
